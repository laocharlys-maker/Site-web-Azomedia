name: Build and deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci
      - run: npm run build

      # Nécessite 3 secrets dans Settings > Secrets and variables > Actions :
      # VPS_HOST (ex: 123.45.67.89), VPS_USER (ex: deploy), VPS_SSH_KEY (clé privée dédiée)
      # et une variable VPS_PATH (ex: /var/www/azomedia/dist)
      - name: Deploy dist/ via rsync
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: dist/
          remote_path: ${{ vars.VPS_PATH }}
          remote_host: ${{ secrets.VPS_HOST }}
          remote_user: ${{ secrets.VPS_USER }}
          remote_key: ${{ secrets.VPS_SSH_KEY }}
